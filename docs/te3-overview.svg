<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="TE3 Engine system overview: inputs, data, model and outputs">
  <title>TE3 Engine system overview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background card so the figure reads on light and dark pages -->
  <rect x="0" y="0" width="1000" height="400" rx="16" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="64" rx="16" fill="#1f3a56"/>
  <rect x="0" y="48" width="1000" height="16" fill="#1f3a56"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#ffffff">TE3 Engine</text>
  <text x="160" y="40" font-size="15" fill="#cbd5e1">Municipal solar and battery screening, New York State, Version 1</text>

  <!-- column 1: inputs -->
  <g>
    <rect x="32" y="96" width="210" height="200" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="32" y="96" width="210" height="6" rx="3" fill="#0891b2"/>
    <text x="52" y="132" font-size="13" font-weight="700" fill="#0891b2" letter-spacing="1">1  INPUTS</text>
    <text x="52" y="162" font-size="14" fill="#0f172a">ZIP code (New York)</text>
    <text x="52" y="186" font-size="14" fill="#0f172a">Facility type (12)</text>
    <text x="52" y="210" font-size="14" fill="#0f172a">Solar size, 10 to 500 kW</text>
    <text x="52" y="234" font-size="14" fill="#0f172a">Battery, 2 or 4 hours</text>
    <text x="52" y="258" font-size="14" fill="#0f172a">Metering, shaving,</text>
    <text x="52" y="278" font-size="14" fill="#0f172a">demand response, islanding</text>
  </g>

  <!-- column 2: data -->
  <g>
    <rect x="270" y="96" width="210" height="200" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="270" y="96" width="210" height="6" rx="3" fill="#7c3aed"/>
    <text x="290" y="132" font-size="13" font-weight="700" fill="#7c3aed" letter-spacing="1">2  DATA</text>
    <text x="290" y="162" font-size="14" fill="#0f172a">Nominatim geocoder</text>
    <text x="290" y="186" font-size="14" fill="#0f172a">PVWatts v8, NSRDB</text>
    <text x="290" y="210" font-size="14" fill="#0f172a">CBECS facility benchmarks</text>
    <text x="290" y="234" font-size="14" fill="#0f172a">EIA-861 commercial rate</text>
    <text x="290" y="258" font-size="14" fill="#0f172a">National Grid tariffs</text>
    <text x="290" y="282" font-size="14" fill="#0f172a">NYISO SCR rules</text>
  </g>

  <!-- column 3: model -->
  <g>
    <rect x="508" y="96" width="210" height="200" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="508" y="96" width="210" height="6" rx="3" fill="#218838"/>
    <text x="528" y="132" font-size="13" font-weight="700" fill="#218838" letter-spacing="1">3  MODEL (F1 TO F11)</text>
    <text x="528" y="162" font-size="14" fill="#0f172a">Solar generation</text>
    <text x="528" y="186" font-size="14" fill="#0f172a">Energy savings, metering</text>
    <text x="528" y="210" font-size="14" fill="#0f172a">Peak shaving</text>
    <text x="528" y="234" font-size="14" fill="#0f172a">NYISO demand response</text>
    <text x="528" y="258" font-size="14" fill="#0f172a">Cost, tax credit, payback</text>
    <text x="528" y="282" font-size="14" fill="#0f172a">Backup duration</text>
  </g>

  <!-- column 4: outputs -->
  <g>
    <rect x="746" y="96" width="222" height="200" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="746" y="96" width="222" height="6" rx="3" fill="#ea580c"/>
    <text x="766" y="132" font-size="13" font-weight="700" fill="#ea580c" letter-spacing="1">4  OUTPUTS</text>
    <text x="766" y="162" font-size="14" fill="#0f172a">Streamlit dashboard</text>
    <text x="766" y="186" font-size="14" fill="#0f172a">4 page PDF report:</text>
    <text x="778" y="210" font-size="14" fill="#334155">results and payback</text>
    <text x="778" y="234" font-size="14" fill="#334155">screening notes</text>
    <text x="778" y="258" font-size="14" fill="#334155">formulas and sources</text>
  </g>

  <!-- arrows -->
  <line x1="244" y1="196" x2="266" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="482" y1="196" x2="504" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="196" x2="742" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- planned work -->
  <line x1="613" y1="298" x2="613" y2="324" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="32" y="328" width="936" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="52" y="356" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1">PLANNED</text>
  <text x="140" y="356" font-size="14" fill="#475569">Version 1.1 methods (modeled AC output, critical load backup, sourced costs, monthly demand), NPV, national coverage</text>
</svg>
